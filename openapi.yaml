openapi: 3.0.3
info:
  title: TCSS 460 — Group 3 API
  description: |
    **Team:** Group 3

    Backend API for the TCSS 460 group project. Use **GET /heartbeat** to confirm the service is reachable (no auth, no database).

    **Live deployment:** See the Production entry under `servers`. If your host differs, update that URL in this file so `/api-docs` stays accurate.
  version: 0.1.0

servers:
  - url: https://group-project-backend-group-3-1.onrender.com
    description: Deployed server on Render
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Heartbeat
    description: HTTP request to verify server is alive
  - name: Movies
    description: Movie endpoints
  - name: Shows
    description: TV show endpoints
  - name: Reviews
    description: Review endpoints
  - name: Ratings
    description: Rating endpoints
  - name: Issues
    description: Bug reporting endpoints
  - name: Details
    description: Enriched TMDB detail endpoints

paths:
  /heartbeat:
    get:
      tags: [Heartbeat]
      summary: GET heartbeat status
      description: Returns a message declaring that the server is alive
      responses:
        '200':
          description: A greeting message
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: 'The server is alive and running.'
                    description: Human-readable confirmation that the server responded successfully.

  /movies:
    get:
      tags: [Movies]
      summary: Search movies by title
      description: |
        Search for movies by title. Returns a list of matches or a message if no results are found.
      parameters:
        - name: title
          in: query
          required: true
          description: Movie title (or fragment) passed to TMDB as the search query.
          schema:
            type: string
            example: matrix
      responses:
        '200':
          description: |
            A list of matching movies, or an object with a message if no results are found.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      required: [title, releaseDate, description, id]
                      properties:
                        title:
                          type: string
                          example: The Matrix
                        poster:
                          type: string
                          nullable: true
                          example: /f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg
                        releaseDate:
                          type: string
                          example: '1999-03-31'
                        description:
                          type: string
                        id:
                          type: integer
                          example: 603
                  - type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        example: 'No movies found with title: nothing'
        '400':
          description: Missing required `title` query parameter.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: Title is required
        '401':
          description: Unauthorized request to external movie service.
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status:
                    type: string
                    example: 'Unauthorized - 401'
                  error:
                    type: string
                    example: TMDB API error
        '404':
          description: Requested resource was not found.
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status:
                    type: string
                    example: 'Not Found - 404'
                  error:
                    type: string
                    example: TMDB API error
        default:
          description: |
            An error occurred while fetching movie data.
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status:
                    type: string
                  error:
                    type: string
                    example: TMDB API error
        '500':
          description: Server configuration error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: TMDB token is not configured
        '502':
          description: Failed to retrieve data from external service.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to reach TMDB service

  /movies/{id}:
    get:
      tags: [Movies]
      summary: Get movie details by ID
      description: |
        Retrieve detailed information about a specific movie using its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: TMDB movie ID.
          schema:
            type: integer
            example: 550
      responses:
        '200':
          description: Detailed information about the requested movie.
          content:
            application/json:
              schema:
                type: object
                required: [title, release_date, overview, revenue, runtime, budget]
                properties:
                  title:
                    type: string
                    example: Fight Club
                  poster_path:
                    type: string
                    nullable: true
                  release_date:
                    type: string
                    example: '1999-10-15'
                  overview:
                    type: string
                  revenue:
                    type: number
                    example: 100853753
                  runtime:
                    type: integer
                    example: 139
                  budget:
                    type: number
                    example: 63000000
        '400':
          description: Missing or invalid movie ID.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: ID required
        '401':
          description: Authentication failed or external service access was denied.
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status:
                    type: string
                    example: 'Unauthorized - 401'
                  error:
                    type: string
                    example: TMDB API error
        '404':
          description: The requested movie was not found.
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status:
                    type: string
                    example: 'Not Found - 404'
                  error:
                    type: string
                    example: TMDB API error
        default:
          description: |
            An unexpected error occurred while processing the request.
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status:
                    type: string
                  error:
                    type: string
                    example: TMDB API error
        '500':
          description: Server configuration error. Required service credentials are missing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: TMDB token is not configured
        '502':
          description: Failed to retrieve data from external service.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to reach TMDB service

  /movies/popular:
    get:
      tags: [Movies]
      summary: Get popular movies
      description: Returns top 10 popular movies in English from a transformed backend schema.
      responses:
        '200':
          description: Popular movie list.
          content:
            application/json:
              schema:
                type: object
                required: [count, results]
                properties:
                  count:
                    type: integer
                    example: 10
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, title, releaseDate, description, genreIds]
                      properties:
                        id:
                          type: integer
                          example: 603
                        title:
                          type: string
                          example: Fight Club
                        poster:
                          type: string
                          nullable: true
                          example: /f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg
                        releaseDate:
                          type: string
                          example: '1999-10-15'
                        description:
                          type: string
                        genreIds:
                          type: array
                          items:
                            type: integer
                          example: [18, 53]
        '500':
          description: Missing TMDB token configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: TMDB token is not configured
        '502':
          description: Upstream TMDB call failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to reach TMDB service

  /shows:
    get:
      tags: [Shows]
      summary: Search TV shows by title
      description: |
        Returns a list of TV shows that match the provided title or keyword.

        If no shows are found, an empty array (`[]`) is returned.

        Results include basic show information such as title, image, release date, description, and genre IDs.
      parameters:
        - name: title
          in: query
          required: true
          description: The title or keyword to search for TV shows.
          schema:
            type: string
            example: invincible
      responses:
        '200':
          description: A list of matching TV shows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShowSearchResult'
        '400':
          description: Missing or invalid title parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                error:
                  value:
                    error: Query parameter title is required
        '500':
          description: Server error while processing request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                error:
                  value:
                    error: Internal server error

  /shows/{id}:
    get:
      tags: [Shows]
      summary: Get TV show details by ID
      description: Retrieve detailed information about a specific TV show using its ID if it exists within the TMDB database.
      parameters:
        - name: id
          in: path
          required: true
          description: The TV show ID based on TMDB.
          schema:
            type: integer
            example: 2004
      responses:
        '200':
          description: Detailed information about the requested TV show.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedShowResult'
        '400':
          description: Show ID is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                missingId:
                  value:
                    error: ID required
        '500':
          description: |
            Server or upstream failure: TMDB credentials missing, TMDB returned a non-success HTTP status, or the outbound request failed (network/timeout).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                noAuth:
                  summary: No TMDB_BEARER_TOKEN or TMDB_API_KEY

  /shows/popular:
    get:
      tags: [Shows]
      summary: Get popular TV shows
      description: Returns top 10 popular TV shows in English from a transformed backend schema.
      responses:
        '200':
          description: Popular show list.
          content:
            application/json:
              schema:
                type: object
                required: [count, results]
                properties:
                  count:
                    type: integer
                    example: 10
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, title, releaseDate, shortDescription, genreIds]
                      properties:
                        id:
                          type: integer
                          example: 1399
                        title:
                          type: string
                          example: Game of Thrones
                        posterImage:
                          type: string
                          nullable: true
                          example: https://image.tmdb.org/t/p/w500/1.png
                        releaseDate:
                          type: string
                          example: '2011-04-17'
                        shortDescription:
                          type: string
                        genreIds:
                          type: array
                          items:
                            type: integer
                          example: [10765, 18, 10759]
        '500':
          description: Missing TMDB token configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: TMDB token is not configured
        '502':
          description: Upstream TMDB call failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to reach TMDB service

  /reviews:
    post:
      tags: [Reviews]
      summary: Create a review
      description: |
        Adds a review for the current user.

        Requires authentication (Bearer token).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: OK Created Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Invalid or expired token
        '502':
          $ref: '#/components/responses/IdentityProviderError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Internal server error

  /reviews/{reviewId}:
    get:
      tags: [Reviews]
      summary: Get a single review
      description: |
        Get one review by review id (public endpoint).
      parameters:
        - name: reviewId
          in: path
          required: true
          description: Review id
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Review found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: 'Parameter "reviewId" must be a positive integer'
        '404':
          description: No review with that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Review not found
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    patch:
      tags: [Reviews]
      summary: Update a review
      description: |
        Update an existing review for the logged-in user.

        Requires authentication (Bearer token).
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          description: Review id
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Authenticated user does not own this review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: You can only update your own reviews
        '404':
          description: No review with that id for the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Review not found
        '502':
          $ref: '#/components/responses/IdentityProviderError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    delete:
      tags: [Reviews]
      summary: Delete a review
      description: |
        Removes a review for the current user.

        Requires authentication (Bearer token).
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          description: Review id
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: OK Deleted Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDeleteSuccess'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: 'Parameter "reviewId" must be a positive integer'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Authenticated user is not owner and not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: You can only delete your own reviews
        '404':
          description: |
            There is no review with that id for that account, or it was already deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Review not found
        '502':
          $ref: '#/components/responses/IdentityProviderError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Internal server error

  /ratings:
    post:
      tags: [Ratings]
      summary: Create a rating
      description: Adds a rating for the current user. Requires a Bearer token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingCreateRequest'
      responses:
        '201':
          description: OK Created Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Invalid or expired token
        '502':
          $ref: '#/components/responses/IdentityProviderError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Internal server error

  /ratings/{ratingId}:
    get:
      tags: [Ratings]
      summary: Get a rating
      description: Reads one rating by id.
      parameters:
        - name: ratingId
          in: path
          required: true
          description: Rating id
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: 'Parameter "ratingId" must be a positive integer'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Rating not found
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Internal server error
    delete:
      tags: [Ratings]
      summary: Delete a rating
      description: Removes a rating for the current user. Requires a Bearer token.
      security:
        - bearerAuth: []
      parameters:
        - name: ratingId
          in: path
          required: true
          description: Rating id
      responses:
        '200':
          description: OK Deleted Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingDeleteSuccess'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Parameter "ratingId" must be a positive integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Rating not found
        '502':
          $ref: '#/components/responses/IdentityProviderError'

        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Internal server error
    patch:
      tags: [Ratings]
      summary: Update a rating
      description: Updates the current user's rating. Requires a Bearer token.
      security:
        - bearerAuth: []
      parameters:
        - name: ratingId
          in: path
          required: true
          description: Rating id
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingUpdateRequest'
      responses:
        '200':
          description: OK Updated Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: |
            There is no rating with that id for that account, or it does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Rating not found
        '502':
          $ref: '#/components/responses/IdentityProviderError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Internal server error

  /issues:
    get:
      tags: [Issues]
      summary: List reported issues
      description: Returns all bug reports sorted by latest report date first.
      responses:
        '200':
          description: List of issues.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    post:
      tags: [Issues]
      summary: Create a bug report
      description: Creates a new issue entry used for bug reporting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreateRequest'
      responses:
        '201':
          description: Issue created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          description: Invalid issue payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                invalidStatus:
                  value:
                    error: 'issueStatus must be one of: OPEN, IN_PROGRESS, RESOLVED, CLOSED'
                missingDescription:
                  value:
                    error: issueDesc is required
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /details/{type}/{id}:
    get:
      tags: [Details]
      summary: Get enriched movie/show details
      description: Returns TMDB details plus local community rating/review data.
      parameters:
        - name: type
          in: path
          required: true
          description: Content type.
          schema:
            type: string
            enum: [movie, show]
        - name: id
          in: path
          required: true
          description: TMDB id.
          schema:
            type: integer
            minimum: 1
            example: 550
      responses:
        '200':
          description: Enriched details response.
          content:
            application/json:
              schema:
                type: object
                required: [type, tmdbId, metadata, community]
                properties:
                  type:
                    type: string
                    enum: [movie, show]
                  tmdbId:
                    type: integer
                  metadata:
                    type: object
                    additionalProperties: true
                  community:
                    type: object
                    required: [averageRating, reviewCount, recentReviews]
                    properties:
                      averageRating:
                        type: number
                        nullable: true
                        example: 4.2
                      reviewCount:
                        type: integer
                        example: 3
                      recentReviews:
                        type: array
                        items:
                          type: object
                          required: [reviewId, userId, username, reviewContent, dateOfReview]
                          properties:
                            reviewId:
                              type: integer
                              example: 1
                            userId:
                              type: integer
                              description: Local user primary key (`User.id`). Auth subject is `User.subjectId`, not returned here.
                              example: 1
                            username:
                              type: string
                              example: example
                            reviewContent:
                              type: string
                              example: Great pacing and story.
                            dateOfReview:
                              type: string
                              format: date-time
                              example: '2026-05-01T00:00:00.000Z'
        '400':
          description: Invalid route parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                invalidType:
                  value:
                    error: Parameter "type" must be "movie" or "show"
                invalidId:
                  value:
                    error: Parameter "id" must be a positive integer
        '404':
          description: TMDB item not found.
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status:
                    type: string
                    example: Not Found - 404
                  error:
                    type: string
                    example: TMDB API error
        '500':
          description: TMDB token missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '502':
          description: Failed to reach TMDB service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth² issues JWT access tokens

  responses:
    IdentityProviderError:
      description: |
        User info could not be loaded when provisioning a new local user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            error: Failed to load user profile from identity provider

  schemas:
    ErrorMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message from this API.
      example:
        error: Something went wrong

    ReviewCreateRequest:
      type: object
      required: [reviewContent, isMovie, dateOfReview, tmdbIdentifier]
      properties:
        reviewContent:
          type: string
          description: Review body
          example: A thoughtful take on the film.
        isMovie:
          type: boolean
          description: true = movie, false = show
          example: true
        dateOfReview:
          type: string
          format: date
          example: '2026-04-25'
        tmdbIdentifier:
          type: integer
          minimum: 1
          description: TMDB movie id or TV series id for the reviewed title
          example: 550

    ReviewUpdateRequest:
      type: object
      description: Updates review text and date of review.
      required: [reviewContent, dateOfReview]
      properties:
        reviewContent:
          type: string
          description: Review body
          example: An updated take.
        dateOfReview:
          type: string
          format: date
          example: '2026-04-25'

    Review:
      type: object
      required: [reviewId, reviewContent, isMovie, dateOfReview, tmdbIdentifier]
      description: Review resource; `reviewContent` is the review text; `isMovie` is true for movie, false for show.
      properties:
        reviewId:
          type: integer
          example: 1
        reviewContent:
          type: string
          example: A thoughtful take on the film.
        isMovie:
          type: boolean
          description: true = movie, false = show
          example: true
        dateOfReview:
          type: string
          example: '2026-04-25'
        tmdbIdentifier:
          type: integer
          description: TMDB id for the movie or TV series
          example: 550

    ReviewDeleteSuccess:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Review deleted successfully

    RatingUpdateRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 10
          description: New score (1–10); stored in the `rating` column
          example: 8

    RatingCreateRequest:
      type: object
      required: [isMovie, rating, tmdbIdentifier]
      properties:
        isMovie:
          type: boolean
          description: true = movie, false = show
          example: true
        rating:
          type: integer
          minimum: 1
          maximum: 10
          description: Score 1–10
          example: 8
        tmdbIdentifier:
          type: integer
          minimum: 1
          description: TMDB movie id or TV series id
          example: 550

    RatingDeleteSuccess:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: rating deleted successfully

    Rating:
      type: object
      required: [ratingId, isMovie, rating, tmdbIdentifier]
      properties:
        ratingId:
          type: integer
          example: 1
        isMovie:
          type: boolean
          description: true = movie, false = show
          example: true
        rating:
          type: integer
          description: Score (e.g. 1–10), maps from DB column `rating`
          example: 8
        tmdbIdentifier:
          type: integer
          description: TMDB id for the rated title
          example: 550

    IssueCreateRequest:
      type: object
      required: [issueStatus, issueDesc]
      properties:
        issueStatus:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
          description: Current bug lifecycle status.
          example: OPEN
        issueDesc:
          type: string
          description: Human-readable bug description.
          example: Search endpoint throws 500 on empty query.

    Issue:
      type: object
      required: [issueID, issueStatus, issueDesc, issueReportDate]
      properties:
        issueID:
          type: integer
          example: 1
        issueStatus:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
          example: OPEN
        issueDesc:
          type: string
          example: Search endpoint throws 500 on empty query.
        issueReportDate:
          type: string
          format: date-time
          description: Issue creation timestamp in UTC (ISO-8601; `Z` suffix).
          example: '2026-04-30T23:26:42.123Z'

    ShowSearchResult:
      type: object
      description: One TV series match after normalization for clients.
      required: [id, title, posterImage, releaseDate, shortDescription, genreIds]
      properties:
        id:
          type: integer
          description: TMDB TV series id (`tv_id`).
          example: 95557
        title:
          type: string
          description: Series title (from TMDB `name`).
          example: Invincible
        posterImage:
          type: string
          nullable: true
          description: |
            Full poster URL (`w500` width) or `null` when TMDB has no `poster_path`.
          example: https://image.tmdb.org/t/p/w500/yDWJYRAfMNu9y2A0jN0aYf6APmn.jpg
        releaseDate:
          type: string
          description: First air date (from TMDB `first_air_date`, ISO `YYYY-MM-DD` when present; may be empty).
          example: '2021-03-26'
        shortDescription:
          type: string
          description: Overview / synopsis (from TMDB `overview`).
        genreIds:
          type: array
          description: TMDB genre id list (`genre_ids`).
          items:
            type: integer
          example: [16, 10765, 9648]

    DetailedShowResult:
      type: object
      description: One TV series match after normalization for clients.
      required:
        [
          title,
          id,
          shortDescription,
          creator,
          genres,
          posterImage,
          releaseDate,
          episodeCount,
          seasonCount,
        ]
      properties:
        title:
          type: string
          description: Series title (from TMDB `name`).
          example: Invincible
        id:
          type: integer
          description: Series TMDB id (`id`).
          example: 54
        shortDescription:
          type: string
          description: Overview / synopsis (from TMDB `overview`).
          example: Teenage son of the most powerful superhero on the planet.
        creator:
          type: array
          description: List of creators (from TMDB `created_by`).
          items:
            type: string
          example: [Kevin Lam, Christian De Dios]
        genres:
          type: array
          description: List of genre objects returned by TMDB.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: integer
                example: 35
              name:
                type: string
                example: Comedy
          example:
            - id: 35
              name: Comedy
        posterImage:
          type: string
          nullable: true
          description: |
            Full poster URL (`w500` width) or `null` when TMDB has no `poster_path`.
          example: https://image.tmdb.org/t/p/w500/yDWJYRAfMNu9y2A0jN0aYf6APmn.jpg
        releaseDate:
          type: string
          description: First air date (from TMDB `first_air_date`, ISO `YYYY-MM-DD` when present; may be empty).
          example: '2021-03-26'
        episodeCount:
          type: integer
          description: Number of episodes in the series.
          example: 12
        seasonCount:
          type: integer
          description: Number of seasons in the series.
          example: 2
